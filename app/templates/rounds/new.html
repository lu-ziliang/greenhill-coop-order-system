{% extends 'base.html' %}
{% block content %}
<h1>Create New Round</h1>
<form method="POST">
    <div class="form-group">
        <label>Round Name</label>
        <input type="text" name="name" placeholder="e.g. Week 1 Round" required>
    </div>
    <div class="form-group">
        <label>Start Date</label>
        <input type="date" name="start_date">
    </div>
    <div class="form-group">
        <label>End Date</label>
        <input type="date" name="end_date">
    </div>
    <button type="submit" class="btn">Create & Open Round</button>
    <p><small>Note: Creating a new round will automatically close any currently open round.</small></p>
</form>
{% endblock %}
