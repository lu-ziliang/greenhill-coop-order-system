{% extends 'base.html' %}
{% block content %}
<h1>Edit Product</h1>
<form method="POST">
    <div class="form-group">
        <label>Product Name</label>
        <input type="text" name="name" value="{{ product.name }}" required>
    </div>
    <div class="form-group">
        <label>Price</label>
        <input type="number" step="0.01" name="price" value="{{ product.price }}" required>
    </div>
    <div class="form-group">
        <label>Pricing Unit</label>
        <select name="pricing_unit">
            <option value="unit" {% if product.pricing_unit == 'unit' %}selected{% endif %}>Per Unit</option>
            <option value="kg" {% if product.pricing_unit == 'kg' %}selected{% endif %}>Per Kilogram</option>
        </select>
    </div>
    <div class="form-group">
        <label>Bay Location</label>
        <input type="text" name="bay_location" value="{{ product.bay_location }}">
    </div>
    <button type="submit" class="btn">Save Changes</button>
</form>
{% endblock %}
