{% extends "base.html" %}
{% block title %}Edit Product - Greenhill Food Co-op{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-body p-4">
                <h3 class="mb-4">Edit Product</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Product Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="price" class="form-label">Price ($)</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="price" name="price" value="{{ product.price }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="pricing_unit" class="form-label">Pricing Unit</label>
                        <select class="form-select" id="pricing_unit" name="pricing_unit" required>
                            <option value="kg" {% if product.pricing_unit == 'kg' %}selected{% endif %}>kg</option>
                            <option value="g" {% if product.pricing_unit == 'g' %}selected{% endif %}>g</option>
                            <option value="L" {% if product.pricing_unit == 'L' %}selected{% endif %}>L</option>
                            <option value="each" {% if product.pricing_unit == 'each' %}selected{% endif %}>each</option>
                            <option value="bunch" {% if product.pricing_unit == 'bunch' %}selected{% endif %}>bunch</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="bay_location" class="form-label">Bay Location</label>
                        <input type="text" class="form-control" id="bay_location" name="bay_location" value="{{ product.bay_location }}">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="{{ url_for('products.list_products') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
